name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        numpy: ["2.0.*", "latest"]
        exclude:
          - python-version: "3.13"
            numpy: "2.0.*"
        include:
          - python-version: "3.12"
            numpy: "2.0.*"
    env:
      XUPY_NO_GPU_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
          if [ "${{ matrix.numpy }}" != "latest" ]; then pip install "numpy==${{ matrix.numpy }}"; fi

      - name: Run tests
        run: python -m pytest -q -m "not slow"
